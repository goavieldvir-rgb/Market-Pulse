name: Update insider trading data

on:
  schedule:
    - cron: '*/30 * * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-insiders
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch insider trading data
        run: python scripts/fetch_insiders.py

      - name: Commit and push if changed
        run: |
          git config user.name "market-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/insiders.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update insider trading data [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed (remote moved on) - retrying..."
              sleep 5
            done
          fi
