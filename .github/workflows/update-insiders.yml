name: Update insider trading data

# Every ~2 hours (UTC). GitHub may run these late or skip some; the script
# back-fills anything it missed from EDGAR's daily index, so nothing is lost.
on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-insiders
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Fetch SEC Form 4 insider trades
        run: python3 scripts/fetch_insiders.py

      - name: Publish
        if: always()
        run: >-
          python3 scripts/publish.py "chore: update insider trading data [skip ci]" data/insiders.json
