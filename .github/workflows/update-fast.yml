name: Update fast market data

on:
  schedule:
    - cron: '*/15 * * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-fast
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch fast indicators
        run: python scripts/fetch_fast.py

      - name: Commit and push if changed
        run: |
          git config user.name "market-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fast.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update fast market data [skip ci]"
            git push
          fi
