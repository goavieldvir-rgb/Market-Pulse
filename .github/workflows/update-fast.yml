name: Update slow market data

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-slow
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch breadth + opportunity scan (S&P 500 + Nasdaq 100)
        run: python scripts/fetch_breadth.py

      - name: Fetch AAII sentiment
        run: python scripts/fetch_aaii.py

      - name: Snapshot today's composite score & breadth for history
        run: python scripts/fetch_history_snapshot.py

      - name: Commit and push if changed
        run: |
          git config user.name "market-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/breadth.json data/opportunities.json data/aaii.json data/history.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update breadth, opportunity scan, sentiment & history [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed (remote moved on) - retrying..."
              sleep 5
            done
          fi
