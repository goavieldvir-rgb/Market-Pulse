name: Update slow market data

# Once per trading day after the US close (UTC times; the second entry is a
# back-up because GitHub's scheduler sometimes skips runs - running twice is harmless).
on:
  schedule:
    - cron: '47 21 * * 1-5'
    - cron: '17 1 * * 2-6'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-slow
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Scan S&P 500 + Nasdaq-100 (breadth + Opportunity Scanner data)
        run: python3 scripts/fetch_breadth.py

      - name: AAII sentiment survey
        run: python3 scripts/fetch_aaii.py

      - name: Daily history for the trend line and percentiles
        run: python3 scripts/build_history.py

      - name: Publish
        if: always()
        run: >-
          python3 scripts/publish.py "chore: update daily scan, sentiment & history [skip ci]"
          data/breadth.json data/opportunities.json data/aaii.json data/daily_history.json
